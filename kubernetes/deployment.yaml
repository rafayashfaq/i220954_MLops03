apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-prediction-api
  namespace: mlops-prod
  labels:
    app: prediction-api
    version: v1.2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: prediction-api
        version: v1.2.0
    spec:
      containers:
        - name: prediction-container
          image: mlops-prediction-api:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mlops-prediction-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
