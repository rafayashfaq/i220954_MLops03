[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ai-agent"
version = "1.0.0"
description = "Production-Ready MLOps AI Agent integrating DVC, MLflow, Airflow, and Kubernetes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Abdul Rafay Ashfaq", email = "ashfaqrafay12@gmail.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "mlflow>=2.10.0",
    "dvc>=3.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", ".dvc", "mlruns", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F841"]
