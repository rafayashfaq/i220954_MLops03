name: MLOps Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check agent/ api/ dags/ training/ tests/

  test:
    name: Automated Unit & Safety Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Baseline Pipeline & Model
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          python training/generate_data.py
          python training/preprocess.py
          python training/train.py --model-type logistic_regression

      - name: Run Pytest Suite
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          ENVIRONMENT: "testing"
        run: |
          pytest -v --tb=short tests/

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Inference Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mlops-prediction-api:latest

